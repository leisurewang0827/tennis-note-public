name: R4 finance protected read diagnostic only
on:
  push:
    branches: [codex/tennisnote-r4-ui-finish-dev-20261108]
    paths: ['.github/workflows/r4-branch-finance-protected-read-diagnostic.yml']
permissions:
  contents: read
  actions: read
jobs:
  protected-read-only:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.run_attempt == 1
    environment:
      name: tennisnote-r4-admin-production
      deployment: false
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - name: Verify exact two-file diagnostics delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA 07be1fc7423d291f4fe094e53c7d446ab303f5c5"
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = "$(printf 'A\t%s\n' .github/workflows/r4-branch-finance-protected-read-diagnostic.yml release-promotions/r4-branch-finance-admin/protected-read-diagnostic.mjs)"
      - name: Record only API stage and HTTP status
        env:
          GH_TOKEN: '${{ github.token }}'
          CLOUDFLARE_API_TOKEN: '${{ secrets.R4_ADMIN_CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: '${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}'
        run: node release-promotions/r4-branch-finance-admin/protected-read-diagnostic.mjs
