name: Tennis Note Public PWA CI

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/build_cloudflare_pages.py"
      - "scripts/check_tennisnote_coach_scope_runtime.cjs"
      - ".github/workflows/tennisnote-public-ci.yml"
  push:
    branches: [dev, main]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/build_cloudflare_pages.py"
      - "scripts/check_tennisnote_coach_scope_runtime.cjs"
      - ".github/workflows/tennisnote-public-ci.yml"

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TENNISNOTE_SUPABASE_URL: https://example.supabase.co
      TENNISNOTE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key-for-ci-only
      TENNISNOTE_PORTONE_STORE_ID: test-store-id
      TENNISNOTE_PORTONE_TOSSPAY_CHANNEL_KEY: test-tosspay-channel
      TENNISNOTE_PAYMENT_MODE: multi
      TENNISNOTE_ALLOWED_PAYMENT_METHODS: tosspay
      TENNISNOTE_BANK_TRANSFER_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # 검증 명령은 scripts/verify.sh 한 곳에만 둔다.
      # 여기에 또 적으면 로컬과 CI 가 서로 어긋난다.
      - name: Verify
        run: ./scripts/verify.sh
