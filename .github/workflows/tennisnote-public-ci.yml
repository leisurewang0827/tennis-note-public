name: Tennis Note Public PWA CI

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/build_cloudflare_pages.py"
      - "scripts/tennisnote_development_email_signin.py"
      - "scripts/check_tennisnote_development_signin_browser.cjs"
      - "scripts/check_tennisnote_verified_profile_phone_browser.cjs"
      - "scripts/check_cloudflare_build.py"
      - "scripts/check_tennisnote_dev_prod_alignment.py"
      - "scripts/check_tennisnote_development_deploy_scope.py"
      - "scripts/verify.sh"
      - "scripts/check_tennisnote_coach_scope_runtime.cjs"
      - "scripts/check_tennisnote_renewal_hold_browser.cjs"
      - "scripts/check_tennisnote_renewal_hold_member.cjs"
      - "scripts/check_tennisnote_r3_effective_browser.cjs"
      - ".github/workflows/tennisnote-public-ci.yml"
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-cloudflare-pages-dev.yml"
  push:
    branches: [dev, main]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/build_cloudflare_pages.py"
      - "scripts/tennisnote_development_email_signin.py"
      - "scripts/check_tennisnote_development_signin_browser.cjs"
      - "scripts/check_tennisnote_verified_profile_phone_browser.cjs"
      - "scripts/check_cloudflare_build.py"
      - "scripts/check_tennisnote_dev_prod_alignment.py"
      - "scripts/check_tennisnote_development_deploy_scope.py"
      - "scripts/verify.sh"
      - "scripts/check_tennisnote_coach_scope_runtime.cjs"
      - "scripts/check_tennisnote_renewal_hold_browser.cjs"
      - "scripts/check_tennisnote_renewal_hold_member.cjs"
      - "scripts/check_tennisnote_r3_effective_browser.cjs"
      - ".github/workflows/tennisnote-public-ci.yml"
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-cloudflare-pages-dev.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TENNISNOTE_SUPABASE_URL: https://example.supabase.co
      TENNISNOTE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key-for-ci-only
      TENNISNOTE_PORTONE_STORE_ID: test-store-id
      TENNISNOTE_PORTONE_TOSSPAY_CHANNEL_KEY: test-tosspay-channel
      TENNISNOTE_PORTONE_KAKAOPAY_CHANNEL_KEY: test-kakaopay-channel
      TENNISNOTE_PAYMENT_MODE: multi
      TENNISNOTE_ALLOWED_PAYMENT_METHODS: tosspay,kakaopay
      TENNISNOTE_BANK_TRANSFER_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select exact R3/Auth source checkpoint
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check_tennisnote_r3_auth548_provenance.cjs --ci-route
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # 제품 빌드 도구를 추가하지 않고 runner 임시 폴더에 검사 의존성만 준비한다.
      - name: Prepare browser test dependencies
        if: ${{ steps.provenance.outputs.scoped != 'true' }}
        timeout-minutes: 5
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/tennisnote-browser" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/tennisnote-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
          echo "NODE_PATH=$RUNNER_TEMP/tennisnote-browser/node_modules" >> "$GITHUB_ENV"
      # 검증 명령은 scripts/verify.sh 한 곳에만 둔다.
      # 여기에 또 적으면 로컬과 CI 가 서로 어긋난다.
      - name: Verify
        if: ${{ steps.provenance.outputs.scoped != 'true' }}
        timeout-minutes: 4
        run: ./scripts/verify.sh
      - name: Verify only newly composed source and context guards
        if: ${{ steps.provenance.outputs.scoped == 'true' }}
        run: |
          node --test tests/r3-auth548-composition.test.js tests/r3-auth548-editor-context.test.js tests/r3-auth548-otp-context.test.js
          python scripts/check_tennisnote_dev_prod_alignment.py

  deploy-development-after-ci:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    needs: build-and-check
    uses: ./.github/workflows/deploy-cloudflare-pages-dev.yml
    permissions:
      contents: read
    secrets: inherit
