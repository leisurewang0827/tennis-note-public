name: Deploy Tennis Note R4 administrator only
run-name: R4 administrator ${{ inputs.mode }} / ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify admission delta or explicitly approved administrator deployment
        type: choice
        required: true
        default: verify
        options: [verify, deploy-development, deploy, coach-verify, coach-dev, coach-prod, app-verify, app-dev, app-prod, entry-verify, entry-dev, entry-prod]
      candidate_sha:
        description: Exact reviewed admission SHA
        type: string
        required: false
      verification_run:
        description: Successful verify-only run for this exact admission SHA; required to deploy
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
jobs:
  verify-candidate:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-prod-candidate' && inputs.mode == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check only admission delta and reuse exact c206 verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check_r4_selfserve_candidate.mjs
      - name: Reproduce frozen administrator artifact with unchanged public operating configuration
        run: node scripts/build_r4_prod_selfserve_release.mjs
  admin-only:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-prod-candidate' && inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: tennisnote-r4-admin-production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Admit exact approved checkpoint and its successful verify-only run
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ vars.TENNISNOTE_R4_ADMIN_APPROVED_SHA }}
          R4_EXECUTION_MODE: ${{ inputs.mode }}
          R4_VERIFICATION_RUN: ${{ inputs.verification_run }}
        run: node scripts/check_r4_selfserve_candidate.mjs --require-prior-ci
      - name: Reproduce exact c206 administrator artifact; reject configuration or recovery drift
        run: node scripts/build_r4_prod_selfserve_release.mjs
      - name: Deploy only the administrator site
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "3.90.0"
          apiToken: ${{ secrets.R4_ADMIN_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/admin --project-name=tennisnote-admin --branch=main

  development-only:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-prod-candidate' && inputs.mode == 'deploy-development'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    concurrency:
      group: cloudflare-pages-development
      cancel-in-progress: false
    env:
      TENNISNOTE_ENVIRONMENT: development
      TENNISNOTE_PAYMENTS_ENABLED: "false"
      TENNISNOTE_SUPABASE_URL: ${{ secrets.DEV_TENNISNOTE_SUPABASE_URL }}
      TENNISNOTE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_TENNISNOTE_SUPABASE_PUBLISHABLE_KEY }}
      TENNISNOTE_PAYMENT_MODE: disabled
      TENNISNOTE_ALLOWED_PAYMENT_METHODS: ""
      TENNISNOTE_BANK_TRANSFER_ENABLED: "false"
      TENNISNOTE_SINGLE_SHEET_IMPORT_MODE: apply
      TENNISNOTE_SINGLE_SHEET_IMPORT_REVERSE_ENABLED: "true"
      EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TENNISNOTE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reuse exact successful verification-only receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check_r4_selfserve_candidate.mjs --require-prior-ci
      - name: Check exact development target and existing recovery
        run: node scripts/build_r4_phone_dev.mjs --preflight
      - name: Build only administrator development assets
        run: node scripts/build_r4_phone_dev.mjs --build
      - name: Deploy only the Seoul development administrator
        run: npx --yes wrangler@3.90.0 pages deploy dist/admin-phone-dev --project-name=tennisnote-admin-dev --branch=dev
  coach-verify:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-prod-candidate' && inputs.mode == 'coach-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: r4-scoped-coach-42335014564
          run-id: 42335014564
          github-token: ${{ github.token }}
          path: coach-base
      - name: Verify exact coach delta and freeze both administrator-only artifacts
        run: |
          node --check app/admin/r4-scoped-coach.js
          node --check app/admin/r4-scoped-coach-workflows.js
          node scripts/r4_scoped_coach_release.mjs build
      - uses: actions/upload-artifact@v4
        with:
          name: r4-scoped-coach-${{ github.run_id }}
          path: coach-release/
          if-no-files-found: error
          retention-days: 3

  coach-dev:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-prod-candidate' && inputs.mode == 'coach-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_SHA: ${{ inputs.candidate_sha }}
      VERIFY_RUN: ${{ inputs.verification_run }}
      APPROVED_SHA: ${{ vars.TENNISNOTE_R4_ADMIN_APPROVED_SHA }}
      EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: r4-scoped-coach-${{ inputs.verification_run }}
          run-id: ${{ inputs.verification_run }}
          github-token: ${{ github.token }}
          path: coach-release
      - name: Require the exact CI artifact and unchanged recoverable site
        run: node scripts/r4_scoped_coach_release.mjs deploy-check dev
      - name: Deploy only the dev administrator site
        run: npx --yes wrangler@3.90.0 pages deploy coach-release/dev --project-name=tennisnote-admin-dev --branch=dev --commit-hash="$GITHUB_SHA" --commit-dirty=false

  coach-prod:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-prod-candidate' && inputs.mode == 'coach-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: tennisnote-r4-admin-production
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_SHA: ${{ inputs.candidate_sha }}
      VERIFY_RUN: ${{ inputs.verification_run }}
      APPROVED_SHA: ${{ vars.TENNISNOTE_R4_ADMIN_APPROVED_SHA }}
      EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.R4_ADMIN_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: r4-scoped-coach-${{ inputs.verification_run }}
          run-id: ${{ inputs.verification_run }}
          github-token: ${{ github.token }}
          path: coach-release
      - name: Require the exact CI artifact and unchanged recoverable site
        run: node scripts/r4_scoped_coach_release.mjs deploy-check prod
      - name: Deploy only the prod administrator site
        run: npx --yes wrangler@3.90.0 pages deploy coach-release/prod --project-name=tennisnote-admin --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=false

  app-verify:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-prod-candidate' && inputs.mode == 'app-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: r4-marketplace-paired-42059081638
          run-id: 42059081638
          github-token: ${{ github.token }}
          path: app-base
      - name: Verify only scoped coach PWA delta and preserve all member assets
        run: |
          node --check app/tennis-note-coach-app/data/r4-scoped-workspace.js
          node --check scripts/build_r4_scoped_coach_app.mjs
          node scripts/r4_scoped_coach_app_release.mjs build
      - uses: actions/upload-artifact@v4
        with:
          name: r4-coach-app-${{ github.run_id }}
          path: coach-app-release/
          if-no-files-found: error
          retention-days: 3

  app-dev:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-prod-candidate' && inputs.mode == 'app-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_SHA: ${{ inputs.candidate_sha }}
      VERIFY_RUN: ${{ inputs.verification_run }}
      EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: r4-coach-app-${{ inputs.verification_run }}
          run-id: ${{ inputs.verification_run }}
          github-token: ${{ github.token }}
          path: coach-app-release
      - name: Verify exact artifact and unchanged recoverable app site
        run: node scripts/r4_scoped_coach_app_release.mjs deploy-check dev
      - name: Deploy coach-only changes to the dev app site
        run: npx --yes wrangler@3.90.0 pages deploy coach-app-release/dev --project-name=tennisnote-app-dev --branch=dev --commit-hash="$GITHUB_SHA" --commit-dirty=false

  app-prod:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-prod-candidate' && inputs.mode == 'app-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: tennisnote-r4-admin-production
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_SHA: ${{ inputs.candidate_sha }}
      VERIFY_RUN: ${{ inputs.verification_run }}
      APPROVED_SHA: ${{ vars.TENNISNOTE_R4_COACH_APP_APPROVED_SHA }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: r4-coach-app-${{ inputs.verification_run }}
          run-id: ${{ inputs.verification_run }}
          github-token: ${{ github.token }}
          path: coach-app-release
      - name: Verify exact approved coach PWA artifact and recovery
        run: node scripts/r4_scoped_coach_app_release.mjs deploy-check prod
      - name: Deploy coach-only changes to the operating app site
        run: npx --yes wrangler@3.90.0 pages deploy coach-app-release/prod --project-name=tennisnote-app --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=false

  entry-verify:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-prod-candidate' && inputs.mode == 'entry-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/
            /scripts/build_r4_member_coach_entry.mjs
            /scripts/r4_member_coach_release.mjs
            /.github/workflows/deploy-cloudflare-pages.yml
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: r4-coach-app-42344119447
          run-id: 42344119447
          github-token: ${{ github.token }}
          path: entry-base
      - run: node scripts/r4_member_coach_release.mjs build
      - uses: actions/upload-artifact@v4
        with:
          name: r4-member-coach-${{ github.run_id }}
          path: member-coach-release/
          if-no-files-found: error
          retention-days: 7
  entry-deploy:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-prod-candidate' && (inputs.mode == 'entry-dev' || inputs.mode == 'entry-prod')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: ${{ inputs.mode == 'entry-prod' && 'tennisnote-r4-admin-production' || 'development' }}
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_SHA: ${{ inputs.candidate_sha }}
      VERIFY_RUN: ${{ inputs.verification_run }}
      APPROVED_SHA: ${{ vars.TENNISNOTE_R4_COACH_APP_APPROVED_SHA }}
      EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/
            /scripts/build_r4_member_coach_entry.mjs
            /scripts/r4_member_coach_release.mjs
            /.github/workflows/deploy-cloudflare-pages.yml
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: r4-member-coach-${{ inputs.verification_run }}
          run-id: ${{ inputs.verification_run }}
          github-token: ${{ github.token }}
          path: member-coach-release
      - run: node scripts/r4_member_coach_release.mjs deploy-check ${{ inputs.mode == 'entry-prod' && 'prod' || 'dev' }}
      - name: Deploy only approved member and coach site
        run: |
          if [ '${{ inputs.mode }}' = 'entry-prod' ]; then
            npx --yes wrangler@3.90.0 pages deploy member-coach-release/prod --project-name=tennisnote-app --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=false
          else
            npx --yes wrangler@3.90.0 pages deploy member-coach-release/dev --project-name=tennisnote-app-dev --branch=dev --commit-hash="$GITHUB_SHA" --commit-dirty=false
          fi
