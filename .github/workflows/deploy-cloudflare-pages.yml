name: Deploy Tennis Note R4 administrator only
run-name: R4 administrator ${{ inputs.mode }} / ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification only or separately approved deployment
        type: choice
        required: true
        default: verify
        options: [verify, deploy-development, deploy, marketplace-verify, marketplace-preview, marketplace-promote, marketplace-rollback]
      candidate_sha:
        description: Exact reviewed SHA required for development deployment
        type: string
        required: false
      prior_run_id:
        description: Exact successful verification or preview run ID
        type: string
        required: false
      qa_verified:
        description: Independent preview QA completed for this exact artifact
        type: boolean
        required: false
        default: false
  push:
    branches: [codex/tennisnote-r4-marketplace-paired-20261106]
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
jobs:
  verify-candidate:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-prod-candidate' && inputs.mode == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify exact self-service administrator delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check_r4_selfserve_candidate.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify changed first workspace artifact
        env:
          TENNISNOTE_ENVIRONMENT: development
          TENNISNOTE_PAYMENTS_ENABLED: "false"
          TENNISNOTE_SUPABASE_URL: https://udjmiezroipctytmztwz.supabase.co
          TENNISNOTE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_r4_local_artifact_only
          TENNISNOTE_PAYMENT_MODE: disabled
          TENNISNOTE_ALLOWED_PAYMENT_METHODS: ""
          TENNISNOTE_BANK_TRANSFER_ENABLED: "false"
          TENNISNOTE_SINGLE_SHEET_IMPORT_MODE: apply
          TENNISNOTE_SINGLE_SHEET_IMPORT_REVERSE_ENABLED: "true"
        run: node scripts/build_r4_phone_dev.mjs --build
  admin-only:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-prod-candidate' && inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    environment: tennisnote-r4-admin-production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact approved administrator-only source
        env:
          APPROVED_SHA: ${{ vars.TENNISNOTE_R4_ADMIN_APPROVED_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          base=dfee6f9324d12e914c65acf4ea4582bf807a839b
          prior=17a34a0de5b97ef0de83b8d595edf22b260407a7
          test "$(git rev-list --parents -n 1 HEAD)" = "$APPROVED_SHA $prior"
          normalization_parent=a32801a876e14bda4aae63e890d3cf23ed854745
          test "$(git rev-parse "$prior^")" = "$normalization_parent"
          prior=$normalization_parent
          recovery_parent=1aa2a5a3f026079a2ae9f229543f297f7f99a753
          test "$(git rev-parse "$prior^")" = "$recovery_parent"
          prior=$recovery_parent
          phone_parent=3bdc51d3d0767cfa0c1c7a4bd627bd3f705ec555
          test "$(git rev-parse "$prior^")" = "$phone_parent"
          prior=$phone_parent
          checkpoint_parent=69c2f77161bf57ebc3e2efa3bcf061e1d5e6a1da
          test "$(git rev-parse "$prior^")" = "$checkpoint_parent"
          previous=2be559dba0e1dc1e6e791a892cfef834a8de4501
          test "$(git rev-parse "$checkpoint_parent^")" = "$previous"
          test "$(git rev-parse "$previous^")" = "$base"
          test "$(git rev-parse refs/remotes/origin/main)" = "$base"
          diff -u <(printf '%s\n' .github/workflows/deploy-cloudflare-pages.yml app/admin/actions/common.js app/admin/actions/settings.js app/admin/data/common.js app/admin/index.html app/admin/r4-branch-admin-writes.js app/admin/r4-branch-hours.js app/admin/r4-branch-operations.js app/admin/r4-onboarding.js app/admin/r4-phone-verification.js app/admin/r4-selfserve-client.js app/admin/views/settings.js scripts/build_r4_phone_dev.mjs scripts/check_r4_existing_account_ui.mjs scripts/check_r4_selfserve_candidate.mjs) <(git diff --name-only "$base" HEAD)
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Reuse successful verification for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check_r4_selfserve_candidate.mjs --require-prior-ci
      - name: Build administrator only
        env:
          TENNISNOTE_SUPABASE_URL: ${{ secrets.TENNISNOTE_SUPABASE_URL }}
          TENNISNOTE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TENNISNOTE_SUPABASE_PUBLISHABLE_KEY }}
          TENNISNOTE_PORTONE_STORE_ID: ${{ secrets.TENNISNOTE_PORTONE_STORE_ID }}
          TENNISNOTE_PORTONE_CHANNEL_KEY: ${{ secrets.TENNISNOTE_PORTONE_CHANNEL_KEY }}
          TENNISNOTE_PORTONE_TOSSPAY_CHANNEL_KEY: ${{ secrets.TENNISNOTE_PORTONE_TOSSPAY_CHANNEL_KEY }}
          TENNISNOTE_PORTONE_NAVERPAY_CHANNEL_KEY: ${{ secrets.TENNISNOTE_PORTONE_NAVERPAY_CHANNEL_KEY }}
          TENNISNOTE_PORTONE_NAVERPAY_CATEGORY_TYPE: ${{ secrets.TENNISNOTE_PORTONE_NAVERPAY_CATEGORY_TYPE }}
          TENNISNOTE_PORTONE_NAVERPAY_CATEGORY_ID: ${{ secrets.TENNISNOTE_PORTONE_NAVERPAY_CATEGORY_ID }}
          TENNISNOTE_PORTONE_KAKAOPAY_CHANNEL_KEY: ${{ secrets.TENNISNOTE_PORTONE_KAKAOPAY_CHANNEL_KEY }}
          TENNISNOTE_PAYMENT_MODE: multi
          TENNISNOTE_ALLOWED_PAYMENT_METHODS: tosspay,kakaopay
          TENNISNOTE_BANK_TRANSFER_ENABLED: "true"
          TENNISNOTE_SINGLE_SHEET_IMPORT_MODE: apply
          TENNISNOTE_SINGLE_SHEET_IMPORT_REVERSE_ENABLED: "false"
        run: python scripts/build_cloudflare_pages.py --target admin --output dist/admin
      - name: Check administrator artifact and production database target
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path("dist/admin")
          assert root.is_dir() and list(pathlib.Path("dist").iterdir()) == [root]
          assert not (root / "tennis-note-member-app/index.html").exists()
          assert not (root / "tennis-note-coach-app/index.html").exists()
          assert "r4Onboarding" in (root / "index.html").read_text(encoding="utf-8")
          assert (root / "r4-onboarding.js").is_file()
          assert (root / "r4-selfserve-client.js").is_file()
          assert (root / "r4-phone-verification.js").is_file()
          assert "r4BranchOperations" in (root / "index.html").read_text(encoding="utf-8")
          assert (root / "r4-branch-operations.js").is_file()
          cfg = (root / "shared/config.local.js").read_text(encoding="utf-8")
          match = re.search(r"window\.TENNISNOTE_CONFIG\s*=\s*(\{.*?\});", cfg, re.S)
          assert match is not None
          settings = json.loads(match.group(1))
          assert settings["environment"] == "production"
          assert settings["supabaseUrl"].rstrip("/") == "https://cnympiwrwgouuvhaivbc.supabase.co"
          assert settings["projectFingerprint"] == hashlib.sha256(b"cnympiwrwgouuvhaivbc").hexdigest()
          (root / "r4-admin-release.json").write_text(json.dumps({"sourceSha": os.environ["GITHUB_SHA"], "surface": "administrator"}) + "\n", encoding="utf-8")
          PY
      - name: Deploy only the administrator site
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "3.90.0"
          apiToken: ${{ secrets.R4_ADMIN_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/admin --project-name=tennisnote-admin --branch=main

  development-only:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-prod-candidate' && inputs.mode == 'deploy-development'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    concurrency:
      group: cloudflare-pages-development
      cancel-in-progress: false
    env:
      TENNISNOTE_ENVIRONMENT: development
      TENNISNOTE_PAYMENTS_ENABLED: "false"
      TENNISNOTE_SUPABASE_URL: ${{ secrets.DEV_TENNISNOTE_SUPABASE_URL }}
      TENNISNOTE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_TENNISNOTE_SUPABASE_PUBLISHABLE_KEY }}
      TENNISNOTE_PAYMENT_MODE: disabled
      TENNISNOTE_ALLOWED_PAYMENT_METHODS: ""
      TENNISNOTE_BANK_TRANSFER_ENABLED: "false"
      TENNISNOTE_SINGLE_SHEET_IMPORT_MODE: apply
      TENNISNOTE_SINGLE_SHEET_IMPORT_REVERSE_ENABLED: "true"
      EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TENNISNOTE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reuse exact successful verification-only receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check_r4_selfserve_candidate.mjs --require-prior-ci
      - name: Check exact development target and existing recovery
        run: node scripts/build_r4_phone_dev.mjs --preflight
      - name: Build only administrator development assets
        run: node scripts/build_r4_phone_dev.mjs --build
      - name: Deploy only the Seoul development administrator
        run: npx --yes wrangler@3.90.0 pages deploy dist/admin-phone-dev --project-name=tennisnote-admin-dev --branch=dev

  marketplace-verify:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-marketplace-paired-20261106' && (github.event_name == 'push' || inputs.mode == 'marketplace-verify')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TENNISNOTE_ENVIRONMENT: development
      TENNISNOTE_PAYMENTS_ENABLED: "false"
      TENNISNOTE_SUPABASE_URL: https://udjmiezroipctytmztwz.supabase.co
      TENNISNOTE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_r4_local_artifact_only
      TENNISNOTE_PAYMENT_MODE: disabled
      TENNISNOTE_ALLOWED_PAYMENT_METHODS: ""
      TENNISNOTE_BANK_TRANSFER_ENABLED: "false"
      TENNISNOTE_SINGLE_SHEET_IMPORT_MODE: apply
      TENNISNOTE_SINGLE_SHEET_IMPORT_REVERSE_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check development preflight negative cases
        run: |
          node scripts/r4-marketplace-paired/test-preflight.mjs
          node scripts/r4-marketplace-paired/test-rollback.mjs
          node scripts/r4-marketplace-paired/test-check-run.mjs
      - name: Build and check exact synthetic paired candidate
        run: |
          node scripts/r4-marketplace-paired/build.mjs --synthetic
          node scripts/r4-marketplace-paired/test-check-runtime.mjs dist/r4-marketplace-paired/admin/shared/config.local.js
          node scripts/r4-marketplace-paired/seal.mjs create dist/r4-marketplace-paired dist/r4-marketplace-seal.json "$GITHUB_SHA"
          node scripts/r4-marketplace-paired/seal.mjs verify dist/r4-marketplace-paired dist/r4-marketplace-seal.json "$GITHUB_SHA"

  marketplace-preview:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-marketplace-paired-20261106' && inputs.mode == 'marketplace-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    concurrency:
      group: cloudflare-pages-development
      cancel-in-progress: false
    env:
      TENNISNOTE_ENVIRONMENT: development
      TENNISNOTE_PAYMENTS_ENABLED: "false"
      TENNISNOTE_SUPABASE_URL: ${{ secrets.DEV_TENNISNOTE_SUPABASE_URL }}
      TENNISNOTE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_TENNISNOTE_SUPABASE_PUBLISHABLE_KEY }}
      TENNISNOTE_PAYMENT_MODE: disabled
      TENNISNOTE_ALLOWED_PAYMENT_METHODS: ""
      TENNISNOTE_BANK_TRANSFER_ENABLED: "false"
      TENNISNOTE_SINGLE_SHEET_IMPORT_MODE: apply
      TENNISNOTE_SINGLE_SHEET_IMPORT_REVERSE_ENABLED: "true"
      EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      REVIEWED_SHA: ${{ inputs.candidate_sha }}
      PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require exact reviewed commit and successful candidate CI
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          node scripts/r4-marketplace-paired/check-run.mjs "$PRIOR_RUN_ID" verify
      - name: Recheck both existing development deployments
        run: node scripts/r4-marketplace-paired/preflight.mjs
      - name: Build once and seal the development-only paired artifact
        run: |
          node scripts/r4-marketplace-paired/build.mjs --live
          node scripts/r4-marketplace-paired/seal.mjs create dist/r4-marketplace-paired dist/r4-marketplace-seal.json "$GITHUB_SHA"
      - name: Retain exact paired artifact for reviewed promotion
        uses: actions/upload-artifact@v4
        with:
          name: r4-marketplace-paired-${{ github.run_id }}
          path: |
            dist/r4-marketplace-paired/
            dist/r4-marketplace-seal.json
          if-no-files-found: error
          retention-days: 2
      - name: Deploy isolated development preview surfaces
        run: |
          npx --yes wrangler@3.90.0 pages deploy dist/r4-marketplace-paired/admin --project-name=tennisnote-admin-dev --branch=r4-marketplace-qa --commit-hash="$GITHUB_SHA" --commit-dirty=false
          npx --yes wrangler@3.90.0 pages deploy dist/r4-marketplace-paired/member --project-name=tennisnote-app-dev --branch=r4-marketplace-qa --commit-hash="$GITHUB_SHA" --commit-dirty=false

  marketplace-promote:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-marketplace-paired-20261106' && inputs.mode == 'marketplace-promote' && inputs.qa_verified == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    concurrency:
      group: cloudflare-pages-development
      cancel-in-progress: false
    env:
      EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      REVIEWED_SHA: ${{ inputs.candidate_sha }}
      PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Require successful exact preview and reviewed commit
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          node scripts/r4-marketplace-paired/check-run.mjs "$PRIOR_RUN_ID" preview
      - uses: actions/download-artifact@v4
        with:
          name: r4-marketplace-paired-${{ inputs.prior_run_id }}
          run-id: ${{ inputs.prior_run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Verify identical artifact and unchanged development baselines
        run: |
          node scripts/r4-marketplace-paired/seal.mjs verify dist/r4-marketplace-paired dist/r4-marketplace-seal.json "$GITHUB_SHA"
          node scripts/r4-marketplace-paired/check-runtime.mjs dist/r4-marketplace-paired --live
          node scripts/r4-marketplace-paired/preflight.mjs
      - name: Promote only the two development surfaces
        run: |
          npx --yes wrangler@3.90.0 pages deploy dist/r4-marketplace-paired/admin --project-name=tennisnote-admin-dev --branch=dev --commit-hash="$GITHUB_SHA" --commit-dirty=false
          npx --yes wrangler@3.90.0 pages deploy dist/r4-marketplace-paired/member --project-name=tennisnote-app-dev --branch=dev --commit-hash="$GITHUB_SHA" --commit-dirty=false

  marketplace-rollback:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.ref == 'refs/heads/codex/tennisnote-r4-marketplace-paired-20261106' && inputs.mode == 'marketplace-rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: development
    concurrency:
      group: cloudflare-pages-development
      cancel-in-progress: false
    env:
      EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      REVIEWED_SHA: ${{ inputs.candidate_sha }}
      PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Require failed exact promotion and restore only its two development baselines
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          node scripts/r4-marketplace-paired/check-run.mjs "$PRIOR_RUN_ID" failed-promote
          node scripts/r4-marketplace-paired/rollback.mjs
