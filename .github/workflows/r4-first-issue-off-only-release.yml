name: R4 protected production OFF install and admin only
on:
  push:
    branches: [codex/tennisnote-r4-ui-finish-dev-20261108]
    paths: ['.github/workflows/r4-first-issue-off-only-release.yml']
permissions:
  contents: read
  actions: read
jobs:
  off-only-release-delta:
    name: off-only-release-delta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Inspect only this release delta, without operational credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 9966c55f774ee8c5cced5d30632d73b1052a5a19
          node release-promotions/r4-first-issue-off-only/check-off-only-exact-tree.mjs
          node release-promotions/r4-first-issue-off-only/check-r4-off-only-github-db.mjs .
          node release-promotions/r4-first-issue-off-only/check-r4-off-only-protected-sequence.mjs
          node release-promotions/r4-first-issue-off-only/check-r4-off-only-release-entry.mjs .
  production-install-off-and-publish-admin:
    name: production-install-off-and-publish-admin
    needs: off-only-release-delta
    if: ${{ github.run_attempt == 1 }}
    environment: tennisnote-r4-admin-production
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Download the fixed admin artifact and prepare the fixed publisher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/r4-admin-provenance.zip"
          gh api repos/leisurewang0827/tennis-note-public/actions/artifacts/13861437991/zip > "$p"
          printf '%s  %s\n' 26ff7deb94d407f83da4c40856bab75ac1756fd7d412f8c99f85de1357664f1e "$p" | sha256sum -c --status
          unzip -q "$p" -d "$RUNNER_TEMP/r4-source"
          mkdir "$RUNNER_TEMP/r4-wrangler"
          cp release-promotions/r4-first-issue-off-only/publisher/npm-manifest.json "$RUNNER_TEMP/r4-wrangler/package.json"
          cp release-promotions/r4-first-issue-off-only/publisher/npm-lock.json "$RUNNER_TEMP/r4-wrangler/package-lock.json"
          npm ci --prefix "$RUNNER_TEMP/r4-wrangler" --ignore-scripts --no-audit --no-fund
          printf '%s  %s\n' e74e98d70cbfdc33d0d6031589365094d2f8a932d01ac40dfb642a40df7361b4 scripts/r4_internal_registration_prod_promotion.mjs | sha256sum -c --status
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs";import {patchProductionWrangler} from "./scripts/r4_internal_registration_prod_promotion.mjs";const d=process.env.RUNNER_TEMP+"/r4-wrangler/node_modules/wrangler/wrangler-dist/";writeFileSync(d+"cli-r4-single.cjs",patchProductionWrangler(readFileSync(d+"cli.js")),{flag:"wx"});'
          printf '%s  %s\n' e35355b3a5cb45fcb47ad016f043649b8ad891dc5781b7c7e3e278c7deccf5c4 "$RUNNER_TEMP/r4-wrangler/node_modules/wrangler/wrangler-dist/cli-r4-single.cjs" | sha256sum -c --status
      - name: Approved exact-SHA OFF install, separate read and administrator publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          R4_DB_READ_TOKEN: ${{ secrets.R4_FIRST_ISSUE_DB_READ_TOKEN }}
          R4_DB_WRITE_TOKEN: ${{ secrets.R4_FIRST_ISSUE_DB_WRITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.R4_ADMIN_CLOUDFLARE_API_TOKEN }}
          R4_CLOUDFLARE_ACCOUNT_SHA: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
        run: node release-promotions/r4-first-issue-off-only/r4-off-only-protected-entry.mjs release .
