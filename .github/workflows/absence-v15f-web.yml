name: Exact absence V15F web promotion
# New execution only: admit two inherited legacy files only with identical Git bytes.
on:
  push:
    branches: [codex/tennisnote-r4-admin-prod-candidate]
    paths: ['.github/workflows/absence-v15f-web.yml']
permissions: {contents: read, actions: read}
concurrency: {group: cloudflare-pages, cancel-in-progress: false}
jobs:
  verify-source:
    name: verify-source
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: readability-v9-44669723933
          run-id: 44669723933
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/absence-v14-previous'
      - name: Verify and assemble exact assets
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          node release-promotions/absence-v15f-web/check.mjs
          node release-promotions/absence-v15f-web/runner.mjs build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'absence-v15f-web-${{ github.run_id }}'
          path: '${{ runner.temp }}/absence-v15f-web-artifact/'
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'absence-v15f-web-build-diagnostics-${{ github.run_id }}', path: '${{ runner.temp }}/absence-v15f-web-build-failure.json', if-no-files-found: warn, retention-days: 7}
  publish-admin:
    needs: verify-source
    environment: {name: tennisnote-r4-admin-production, deployment: false}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'absence-v15f-web-${{ github.run_id }}', path: '${{ runner.temp }}/absence-v15f-web-artifact'}
      - name: Install pinned transport
        run: |
          set -euo pipefail
          git fetch --no-tags origin b0920a7798b878eaf972ae28870371b89d29b9ed
          mkdir "$RUNNER_TEMP/r4-wrangler"
          git show b0920a7798b878eaf972ae28870371b89d29b9ed:release-promotions/r4-first-issue-off-only/publisher/npm-lock.json > "$RUNNER_TEMP/r4-wrangler/package-lock.json"
          git show b0920a7798b878eaf972ae28870371b89d29b9ed:release-promotions/r4-first-issue-off-only/publisher/npm-manifest.json > "$RUNNER_TEMP/r4-wrangler/package.json"
          printf '%s  %s\n' f235fcb84bdb03932e0eb942af150feb71190fb8b51674d2e0ec4e119534cd79 "$RUNNER_TEMP/r4-wrangler/package-lock.json" eadb69637534a5837f53a1d23fac02e6586c978034b87f6bc26e48a8895bd159 "$RUNNER_TEMP/r4-wrangler/package.json" | sha256sum -c --status
          npm ci --prefix "$RUNNER_TEMP/r4-wrangler" --ignore-scripts --no-audit --no-fund
      - name: Publish administrator once
        env:
          GH_TOKEN: '${{ github.token }}'
          CLOUDFLARE_API_TOKEN: '${{ secrets.R4_ADMIN_CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: '${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}'
        run: node release-promotions/absence-v15f-web/runner.mjs publish admin
      - name: Require admin completion
        if: always()
        run: node release-promotions/absence-v15f-web/runner.mjs completion admin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'absence-v15f-web-admin-completion-${{ github.run_id }}', path: '${{ runner.temp }}/absence-v15f-web-admin-completion.json', if-no-files-found: error, retention-days: 7}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'absence-v15f-web-admin-diagnostics-${{ github.run_id }}', path: '${{ runner.temp }}/absence-v15f-web-admin-*.json', if-no-files-found: warn, retention-days: 7}
  publish-coach:
    needs: [verify-source, publish-admin]
    environment: {name: tennisnote-r4-admin-production, deployment: false}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'absence-v15f-web-${{ github.run_id }}', path: '${{ runner.temp }}/absence-v15f-web-artifact'}
      - name: Install pinned transport
        run: |
          set -euo pipefail
          git fetch --no-tags origin b0920a7798b878eaf972ae28870371b89d29b9ed
          mkdir "$RUNNER_TEMP/r4-wrangler"
          git show b0920a7798b878eaf972ae28870371b89d29b9ed:release-promotions/r4-first-issue-off-only/publisher/npm-lock.json > "$RUNNER_TEMP/r4-wrangler/package-lock.json"
          git show b0920a7798b878eaf972ae28870371b89d29b9ed:release-promotions/r4-first-issue-off-only/publisher/npm-manifest.json > "$RUNNER_TEMP/r4-wrangler/package.json"
          printf '%s  %s\n' f235fcb84bdb03932e0eb942af150feb71190fb8b51674d2e0ec4e119534cd79 "$RUNNER_TEMP/r4-wrangler/package-lock.json" eadb69637534a5837f53a1d23fac02e6586c978034b87f6bc26e48a8895bd159 "$RUNNER_TEMP/r4-wrangler/package.json" | sha256sum -c --status
          npm ci --prefix "$RUNNER_TEMP/r4-wrangler" --ignore-scripts --no-audit --no-fund
      - name: Publish coach once
        env:
          GH_TOKEN: '${{ github.token }}'
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: '${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}'
        run: node release-promotions/absence-v15f-web/runner.mjs publish coach
      - name: Require coach completion
        if: always()
        run: node release-promotions/absence-v15f-web/runner.mjs completion coach
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'absence-v15f-web-coach-completion-${{ github.run_id }}', path: '${{ runner.temp }}/coach-absence-v8-completion/result.json', if-no-files-found: error, retention-days: 7}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'absence-v15f-web-coach-diagnostics-${{ github.run_id }}', path: '${{ runner.temp }}/absence-v15f-web-coach-*.json', if-no-files-found: warn, retention-days: 7}
