name: Deploy Tennis Note web beta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare public site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html commerce.html privacy.html support.html delete-account.html export_manifest.json _site/
          cp -R assets app _site/
          touch _site/.nojekyll

      - name: Generate browser client configuration
        env:
          TENNISNOTE_SUPABASE_URL: ${{ secrets.TENNISNOTE_SUPABASE_URL }}
          TENNISNOTE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TENNISNOTE_SUPABASE_PUBLISHABLE_KEY }}
          TENNISNOTE_PORTONE_STORE_ID: ${{ secrets.TENNISNOTE_PORTONE_STORE_ID }}
          TENNISNOTE_PORTONE_TOSSPAY_CHANNEL_KEY: ${{ secrets.TENNISNOTE_PORTONE_TOSSPAY_CHANNEL_KEY }}
          TENNISNOTE_PAYMENT_MODE: tosspay_only
          TENNISNOTE_ALLOWED_PAYMENT_METHODS: tosspay
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.build_cloudflare_pages import write_browser_config

          write_browser_config(Path("_site/app"))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
