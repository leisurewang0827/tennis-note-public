name: R4 product draft DEV source and preflight
on:
  push:
    branches: [codex/tennisnote-r4-ui-finish-dev-20261108]
    paths:
      - 'release-sources/r4-product-draft-dev/**'
      - 'scripts/r4_product_draft_dev_release.mjs'
      - 'scripts/r4_product_draft_dev_promote.mjs'
      - 'scripts/test_r4_product_draft_dev_*.mjs'
      - '.github/workflows/r4-product-draft-dev-source.yml'
      - '.github/workflows/r4-product-draft-dev-promote.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-pages-development
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/test_r4_product_draft_dev_release_local.mjs
      - run: node scripts/test_r4_product_draft_dev_promotion_local.mjs
      - uses: actions/download-artifact@v4
        with:
          name: r4-ui-finish-42446829367
          run-id: 42446829367
          github-token: ${{ github.token }}
          path: draft-base
      - run: node scripts/test_r4_product_draft_dev_build_local.mjs draft-base
      - run: node scripts/r4_product_draft_dev_release.mjs build
      - uses: actions/upload-artifact@v4
        with:
          name: r4-product-draft-dev-${{ github.run_id }}
          path: draft-release/
          if-no-files-found: error
          retention-days: 7
  preflight:
    needs: build
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/r4_product_draft_dev_release.mjs preflight
