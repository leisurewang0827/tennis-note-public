name: V16 development admin resume
on:
  push:
    branches: [codex/tennisnote-r4-admin-prod-candidate]
    paths: ['.github/workflows/v16-dev-admin-resume.yml']
permissions: {contents: read, actions: read}
concurrency: {group: cloudflare-pages, cancel-in-progress: false}
jobs:
  verify-source:
    name: verify-source
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: {name: development, deployment: false}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - name: Verify failed run and exact receipt without retry
        env: {GH_TOKEN: '${{ github.token }}'}
        run: node release-sources/v16-preview/v16-admin-resume.mjs verify
  publish-admin:
    needs: verify-source
    environment: {name: development, deployment: false}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Verify and safely unpack previous DEV sites artifact
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api repos/leisurewang0827/tennis-note-public/actions/artifacts/14641525346/zip > "$RUNNER_TEMP/v16-resume.zip"
          python -B release-sources/v16-preview/v16-resume-unpack.py "$RUNNER_TEMP/v16-resume.zip" "$RUNNER_TEMP/v16-resume-sites"
      - name: Install pinned existing transport
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/r4-wrangler"
          git show b0920a7798b878eaf972ae28870371b89d29b9ed:release-promotions/r4-first-issue-off-only/publisher/npm-lock.json > "$RUNNER_TEMP/r4-wrangler/package-lock.json"
          git show b0920a7798b878eaf972ae28870371b89d29b9ed:release-promotions/r4-first-issue-off-only/publisher/npm-manifest.json > "$RUNNER_TEMP/r4-wrangler/package.json"
          printf '%s  %s\n' f235fcb84bdb03932e0eb942af150feb71190fb8b51674d2e0ec4e119534cd79 "$RUNNER_TEMP/r4-wrangler/package-lock.json" eadb69637534a5837f53a1d23fac02e6586c978034b87f6bc26e48a8895bd159 "$RUNNER_TEMP/r4-wrangler/package.json" | sha256sum -c --status
          npm ci --prefix "$RUNNER_TEMP/r4-wrangler" --ignore-scripts --no-audit --no-fund
      - name: Reconcile coach and publish only administrator once
        env:
          GH_TOKEN: '${{ github.token }}'
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: '${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}'
        run: node release-sources/v16-preview/v16-admin-resume.mjs publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v16-admin-resume-receipt-${{ github.run_id }}', path: '${{ runner.temp }}/v16-admin-resume-receipt.json', if-no-files-found: error, retention-days: 7}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v16-coach-readiness-${{ github.run_id }}', path: '${{ runner.temp }}/v16-coach-readiness.json', if-no-files-found: warn, retention-days: 7}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'v16-admin-readiness-${{ github.run_id }}', path: '${{ runner.temp }}/v16-admin-readiness.json', if-no-files-found: warn, retention-days: 7}
