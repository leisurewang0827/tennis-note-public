name: R4 independent v2 production administrator only
on:
  push:
    branches: [codex/tennisnote-r4-ui-finish-dev-20261108]
    paths: ['release-promotions/r4-independent-prod-v2/off-receipt.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
jobs:
  promote:
    environment: tennisnote-r4-admin-production
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 3, persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Verify receipt ancestry and source artifact metadata
        id: source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: node scripts/r4_independent_prod_v2_release.mjs promotion-meta
      - uses: actions/download-artifact@v4
        with:
          name: r4-independent-owner-prod-candidate-42846945596
          run-id: 42846945596
          github-token: '${{ github.token }}'
          path: 2026-11-10-r4-general-dev/prod-independent-source-42846945596
      - uses: actions/download-artifact@v4
        with:
          name: r4-independent-prod-v2-candidate-${{ steps.source.outputs.run }}
          run-id: '${{ steps.source.outputs.run }}'
          github-token: '${{ github.token }}'
          path: r4-prod-v2-artifact
      - name: Prepare existing single-request Pages transport
        run: |
          npm install --prefix "$RUNNER_TEMP/r4-wrangler" --no-save --package-lock=false --ignore-scripts wrangler@3.90.0
          node scripts/r4_independent_prod_v2_release.mjs prepare
      - name: Admit exact OFF candidate and recovery
        env:
          GH_TOKEN: '${{ github.token }}'
          R4_ADMIN_CLOUDFLARE_API_TOKEN: '${{ secrets.R4_ADMIN_CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: '${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}'
        run: node scripts/r4_independent_prod_v2_release.mjs admit
      - name: Publish the sealed administrator artifact once
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.R4_ADMIN_CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          R4_V2_SOURCE_COMMIT: '${{ steps.source.outputs.sha }}'
        run: |
          node "$RUNNER_TEMP/r4-wrangler/node_modules/wrangler/wrangler-dist/cli-r4-single.cjs" pages deploy r4-prod-v2-artifact/admin --project-name=tennisnote-admin --branch=main --commit-hash="$R4_V2_SOURCE_COMMIT" --commit-dirty=false > "$RUNNER_TEMP/r4-v2-admin-publish.log" 2>&1
          node scripts/r4_independent_prod_v2_release.mjs publish-receipt
      - name: Verify canonical and immutable administrator assets
        env:
          PUBLISHED_URL: '${{ steps.publish.outputs.url }}'
          R4_ADMIN_CLOUDFLARE_API_TOKEN: '${{ secrets.R4_ADMIN_CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: '${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}'
        run: node scripts/r4_independent_prod_v2_release.mjs post
