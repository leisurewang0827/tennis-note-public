name: R4 product draft DEV read-only diagnostic
on:
  push:
    branches: [codex/tennisnote-r4-ui-finish-dev-20261108]
    paths:
      - 'scripts/r4_product_draft_dev_diagnostic.mjs'
      - '.github/workflows/r4-product-draft-dev-diagnostic.yml'
      - 'release-diagnostics/r4-product-draft-dev/diagnostic.json'
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-development
  cancel-in-progress: false
jobs:
  diagnose:
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/r4_product_draft_dev_diagnostic.mjs
