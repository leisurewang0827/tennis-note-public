name: R4 internal registration production read-only preflight
on:
  push:
    branches: [codex/tennisnote-r4-ui-finish-dev-20261108]
    paths:
      - '.github/workflows/r4-internal-registration-prod-preflight.yml'
      - 'scripts/r4_internal_registration_prod_preflight.mjs'
      - 'scripts/check_r4_internal_registration_prod_preflight.mjs'
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
jobs:
  readonly:
    environment: tennisnote-r4-admin-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: r4-ui-prod-42449225848
          run-id: 42449225848
          github-token: ${{ github.token }}
          path: prod-base
      - name: Verify synthetic read-only admission
        env:
          R4_PROD_BASE: prod-base
        run: |
          node scripts/check_r4_internal_registration_prod_preflight.mjs
          env R4_PROD_SOURCE_BIND_ONLY=1 node scripts/check_r4_internal_registration_prod_preflight.mjs
      - name: Read exact canonical and recovery only
        env:
          GH_TOKEN: ${{ github.token }}
          R4_ADMIN_CLOUDFLARE_API_TOKEN: ${{ secrets.R4_ADMIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
        run: node scripts/r4_internal_registration_prod_preflight.mjs
