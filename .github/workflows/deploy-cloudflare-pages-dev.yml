name: Deploy Tennis Note development sites

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed R3 candidate commit SHA
        required: true
        type: string

      r4_admin_ci_run_id:
        description: Reviewed R4 admin candidate successful CI run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-development
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/tennisnote-r4-ui-finish-dev-20261108') }}

jobs:
  r4-paid-read-member-preview:
    name: Protected R4 DEV member preview only
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/tennisnote-r4-ui-finish-dev-20261108' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Read fixed dispatch input and check successful exact-source CI
        id: admit
        env:
          PREVIEW_INPUT: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node release-sources/r4-paid-read-preview/preview.mjs admit
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.admit.outputs.ci }}
          name: r4-paid-read-preview-${{ github.sha }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r4-paid-member-pack
      - name: Prepare existing pinned deployment transport
        run: npm install --prefix "$RUNNER_TEMP/r4-paid-wrangler" --no-save --package-lock=false --ignore-scripts wrangler@3.90.0
      - name: Publish or restore only the specified DEV member preview, once
        env:
          PREVIEW_INPUT: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
        run: node release-sources/r4-paid-read-preview/preview.mjs deploy "$RUNNER_TEMP/r4-paid-member-pack"

  build-and-deploy-development:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/codex/tennisnote-r4-admin-dev-20261104' || github.ref == 'refs/heads/codex/tennisnote-r4-ui-finish-dev-20261108')) }}
    runs-on: ubuntu-latest
    environment: development
    env:
      TENNISNOTE_ENVIRONMENT: development
      TENNISNOTE_PAYMENTS_ENABLED: "false"
      TENNISNOTE_SUPABASE_URL: ${{ secrets.DEV_TENNISNOTE_SUPABASE_URL }}
      TENNISNOTE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_TENNISNOTE_SUPABASE_PUBLISHABLE_KEY }}
      TENNISNOTE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      TENNISNOTE_WORKFLOW_REF: ${{ github.workflow_ref }}
      EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
      TENNISNOTE_PAYMENT_MODE: disabled
      TENNISNOTE_ALLOWED_PAYMENT_METHODS: ""
      TENNISNOTE_BANK_TRANSFER_ENABLED: "false"
      TENNISNOTE_SINGLE_SHEET_IMPORT_MODE: apply
      TENNISNOTE_SINGLE_SHEET_IMPORT_REVERSE_ENABLED: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Admit exact manual R3 candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          STATUS_GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_r3_dev_deployment.py --source-only

      - name: Build isolated development sites
        run: |
          python scripts/build_cloudflare_pages.py --target member --output dist/member-dev
          python scripts/build_cloudflare_pages.py --target admin --output dist/admin-dev

      - name: Verify development deployment configuration
        run: |
          grep -q '"environment": "development"' dist/member-dev/shared/config.local.js
          grep -q '"enabled": false' dist/member-dev/shared/config.local.js
          grep -q '"singleSheetImportMode": "apply"' dist/admin-dev/shared/config.local.js
          grep -q '"singleSheetImportReverseEnabled": true' dist/admin-dev/shared/config.local.js
          grep -q '개발계 · 실제 결제·푸시 차단' dist/member-dev/index.html
          grep -q '개발계 · 실제 결제·푸시 차단' dist/admin-dev/index.html

      - name: Prevent development release rollback on dev branch pushes
        if: github.event_name == 'push'
        run: python scripts/check_r3_dev_deployment.py --branch-preflight

      - name: Verify exact existing development target and rollback before manual deploy
        if: github.event_name == 'workflow_dispatch'
        env:
          STATUS_GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/check_r3_dev_deployment.py --live-preflight

      - name: Deploy member development PWA
        run: npx --yes wrangler@3.90.0 pages deploy dist/member-dev --project-name=tennisnote-app-dev --branch=dev

      - name: Deploy administrator development web
        run: npx --yes wrangler@3.90.0 pages deploy dist/admin-dev --project-name=tennisnote-admin-dev --branch=dev

  r4-admin-only:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/tennisnote-r4-admin-dev-20261104' }}
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      TENNISNOTE_ENVIRONMENT: development
      TENNISNOTE_PAYMENTS_ENABLED: "false"
      TENNISNOTE_SUPABASE_URL: ${{ secrets.DEV_TENNISNOTE_SUPABASE_URL }}
      TENNISNOTE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_TENNISNOTE_SUPABASE_PUBLISHABLE_KEY }}
      TENNISNOTE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      TENNISNOTE_WORKFLOW_REF: ${{ github.workflow_ref }}
      EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
      TENNISNOTE_PAYMENT_MODE: disabled
      TENNISNOTE_ALLOWED_PAYMENT_METHODS: ""
      TENNISNOTE_BANK_TRANSFER_ENABLED: "false"
      TENNISNOTE_SINGLE_SHEET_IMPORT_MODE: apply
      TENNISNOTE_SINGLE_SHEET_IMPORT_REVERSE_ENABLED: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TENNISNOTE_CI_RUN_ID: ${{ inputs.r4_admin_ci_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build only the development administrator web
        run: python scripts/build_cloudflare_pages.py --target admin --output dist/admin-dev
      - name: Verify exact R4 source, CI, development target and rollback
        env:
          STATUS_GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_r4_admin_dev_deployment.py
      - name: Deploy only the R4 development administrator web
        run: npx --yes wrangler@3.90.0 pages deploy dist/admin-dev --project-name=tennisnote-admin-dev --branch=dev
