name: R4 finance owner production OFF and administrator
on:
  push:
    branches: [codex/tennisnote-r4-ui-finish-dev-20261108]
    paths: ['.github/workflows/r4-finance-owner-prod.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ledger-date-admin-44921413585
          run-id: 44921413585
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/base'
      - name: Check only new execution gates and frozen SQL payloads
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          node --test release-sources/r4-finance-owner-prod/gate.test.mjs
          node --check release-sources/r4-finance-owner-prod/runner.mjs
          node --check release-sources/r4-finance-owner-prod/operator.mjs
          node release-sources/r4-finance-owner-prod/runner.mjs verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-finance-owner-prod-admin-${{ github.run_id }}
          path: '${{ runner.temp }}/candidate'
          if-no-files-found: error
          retention-days: 14
  admit:
    needs: verify
    environment:
      name: tennisnote-r4-admin-production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ledger-date-admin-44921413585
          run-id: 44921413585
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/base'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-finance-owner-prod-admin-${{ github.run_id }}
          path: '${{ runner.temp }}/candidate'
      - name: Protected read-only Cloudflare recovery admission; no installation or publication
        env:
          GH_TOKEN: '${{ github.token }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          CLOUDFLARE_API_TOKEN: '${{ secrets.R4_ADMIN_CLOUDFLARE_API_TOKEN }}'
        run: node release-sources/r4-finance-owner-prod/runner.mjs admit
  publish:
    needs: [verify, admit]
    environment:
      name: tennisnote-r4-admin-production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ledger-date-admin-44921413585
          run-id: 44921413585
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/base'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-finance-owner-prod-admin-${{ github.run_id }}
          path: '${{ runner.temp }}/candidate'
      - name: Prepare existing single-publication transport
        run: |
          set -euo pipefail
          base=release-promotions/r4-first-issue-off-only/publisher
          printf '%s  %s\n' f235fcb84bdb03932e0eb942af150feb71190fb8b51674d2e0ec4e119534cd79 "$base/npm-lock.json" eadb69637534a5837f53a1d23fac02e6586c978034b87f6bc26e48a8895bd159 "$base/npm-manifest.json" | sha256sum -c --status
          mkdir "$RUNNER_TEMP/r4-wrangler"
          cp "$base/npm-lock.json" "$RUNNER_TEMP/r4-wrangler/package-lock.json"
          cp "$base/npm-manifest.json" "$RUNNER_TEMP/r4-wrangler/package.json"
          npm ci --prefix "$RUNNER_TEMP/r4-wrangler" --ignore-scripts --no-audit --no-fund
      - name: Require independently queried OFF attestation before ADMIN-only publication
        env:
          GH_TOKEN: '${{ github.token }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          CLOUDFLARE_API_TOKEN: '${{ secrets.R4_ADMIN_CLOUDFLARE_API_TOKEN }}'
        run: node release-sources/r4-finance-owner-prod/runner.mjs publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r4-finance-owner-prod-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r4-owner-prod-receipt.json
            ${{ runner.temp }}/r4-owner-prod-hold.json
          if-no-files-found: error
          retention-days: 30

