name: Absence simple DEV previews
# Correction: unchanged DEV assets are read from the matching sealed DEV source.
# Correction: pin the observed DEV administrator canonical deployment.
# DEV-only v5.1: consistent surface and single disclosure.
on:
  push:
    branches: [codex/tennisnote-r4-admin-prod-candidate]
    paths: ['.github/workflows/absence-simple-dev-preview.yml']
permissions: {contents: read, actions: read}
concurrency: {group: cloudflare-pages, cancel-in-progress: false}
jobs:
  verify-source:
    name: verify-source
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: {name: development, deployment: false}
    timeout-minutes: 20
    env:
      TENNISNOTE_ENVIRONMENT: development
      TENNISNOTE_PAYMENTS_ENABLED: 'false'
      TENNISNOTE_SUPABASE_URL: '${{ secrets.DEV_TENNISNOTE_SUPABASE_URL }}'
      TENNISNOTE_SUPABASE_PUBLISHABLE_KEY: '${{ secrets.DEV_TENNISNOTE_SUPABASE_PUBLISHABLE_KEY }}'
      TENNISNOTE_PAYMENT_MODE: disabled
      TENNISNOTE_ALLOWED_PAYMENT_METHODS: ''
      TENNISNOTE_BANK_TRANSFER_ENABLED: 'false'
      TENNISNOTE_SINGLE_SHEET_IMPORT_MODE: apply
      TENNISNOTE_SINGLE_SHEET_IMPORT_REVERSE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: node release-sources/absence-simple-preview/check.cjs
      - name: Generate protected development runtime
        run: python -c "from pathlib import Path; from scripts.build_cloudflare_pages import write_browser_config; import os; write_browser_config(Path(os.environ['RUNNER_TEMP']) / 'absence-runtime')"
      - run: node release-sources/absence-simple-preview/build.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'absence-simple-preview-${{ github.run_id }}'
          path: '${{ runner.temp }}/absence-simple-preview/'
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify-source
    environment: {name: development, deployment: false}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: 'absence-simple-preview-${{ github.run_id }}'
          path: '${{ runner.temp }}/absence-simple-preview'
      - name: Install pinned existing transport
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/r4-wrangler"
          git show b0920a7798b878eaf972ae28870371b89d29b9ed:release-promotions/r4-first-issue-off-only/publisher/npm-lock.json > "$RUNNER_TEMP/r4-wrangler/package-lock.json"
          git show b0920a7798b878eaf972ae28870371b89d29b9ed:release-promotions/r4-first-issue-off-only/publisher/npm-manifest.json > "$RUNNER_TEMP/r4-wrangler/package.json"
          printf '%s  %s\n' f235fcb84bdb03932e0eb942af150feb71190fb8b51674d2e0ec4e119534cd79 "$RUNNER_TEMP/r4-wrangler/package-lock.json" eadb69637534a5837f53a1d23fac02e6586c978034b87f6bc26e48a8895bd159 "$RUNNER_TEMP/r4-wrangler/package.json" | sha256sum -c --status
          npm ci --prefix "$RUNNER_TEMP/r4-wrangler" --ignore-scripts --no-audit --no-fund
      - name: Publish only two development previews
        env:
          GH_TOKEN: '${{ github.token }}'
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: '${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}'
        run: node release-sources/absence-simple-preview/publish.mjs
