name: Administrator two-section feedback only
# Reconcile the exact prior GitHub artifact seal; the 184 file hashes and two product bytesets are unchanged.
on:
  push:
    branches: [codex/tennisnote-r4-ui-finish-dev-20261108]
    paths: ['.github/workflows/admin-feedback-only-1128.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'leisurewang0827/tennis-note-public' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-finance-admin-prod-admin-45117904109
          run-id: 45117904109
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/prior-site'
      - name: Verify original sealed site, exact two assets, editor scope and readonly hosted baseline
        env: {GH_TOKEN: '${{ github.token }}'}
        run: node release-sources/admin-feedback-only-1128/operation.mjs verify
  publish:
    needs: verify
    environment:
      name: tennisnote-r4-admin-production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-finance-admin-prod-admin-45117904109
          run-id: 45117904109
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/prior-site'
      - name: Prepare pinned administrator-only transport
        run: |
          set -euo pipefail
          p=release-promotions/r4-first-issue-off-only/publisher
          printf '%s  %s\n' f235fcb84bdb03932e0eb942af150feb71190fb8b51674d2e0ec4e119534cd79 "$p/npm-lock.json" eadb69637534a5837f53a1d23fac02e6586c978034b87f6bc26e48a8895bd159 "$p/npm-manifest.json" | sha256sum -c --status
          mkdir "$RUNNER_TEMP/r4-wrangler"
          cp "$p/npm-lock.json" "$RUNNER_TEMP/r4-wrangler/package-lock.json"
          cp "$p/npm-manifest.json" "$RUNNER_TEMP/r4-wrangler/package.json"
          npm ci --prefix "$RUNNER_TEMP/r4-wrangler" --ignore-scripts --no-audit --no-fund
      - name: Check protected review, live recovery point and branch before one administrator-only publication
        env:
          GH_TOKEN: '${{ github.token }}'
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          EXPECTED_CLOUDFLARE_ACCOUNT_FINGERPRINT: '${{ vars.DEV_CLOUDFLARE_ACCOUNT_FINGERPRINT }}'
        run: node release-sources/admin-feedback-only-1128/operation.mjs publish
